# Vérifie chaque pull request avant sa fusion : types, tests, vérifications SymPy du contenu et construction de l'appli.
# (L'APK n'est publié que depuis la branche par défaut, voir android.yml.)
name: Vérification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: pip install sympy && python3 verification/tout.py
      - run: npm run build

  # L'APK doit toujours se construire (plugins natifs, Gradle) : on le vérifie avant la fusion, sans le publier.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Compilation de l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      # Le nom de version de l'APK doit suivre le numéro de build (« Mes applis » l'affiche) et non rester figé.
      - name: Vérifier le numéro de version de l'APK
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          INFOS=$("$AAPT" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -o "versionName='[^']*'")
          echo "$INFOS"
          ATTENDU="versionName='$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${GITHUB_RUN_NUMBER}'"
          test "$INFOS" = "$ATTENDU" || { echo "Attendu : $ATTENDU"; exit 1; }

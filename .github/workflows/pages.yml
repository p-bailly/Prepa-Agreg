# Construit la version web et la publie dans la branche gh-pages, servie par GitHub Pages :
# https://p-bailly.github.io/Prepa-Agreg/
# Chemins relatifs (base './' dans vite.config.ts) : la même construction sert l'APK et le sous-dossier /Prepa-Agreg/.
name: Site web

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    # Uniquement sur la branche par défaut du dépôt.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Un seul commit dans gh-pages (historique remplacé à chaque publication) ; .nojekyll : fichiers servis tels quels.
      - name: Publication dans gh-pages
        working-directory: dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site construit depuis ${GITHUB_SHA::7} (build n°${{ github.run_number }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

    <script>
      // Thème choisi dans les réglages, posé avant le premier affichage (pas d'éclair blanc sur un téléphone en sombre).
      // Même calcul que estSombre() dans src/lib/reglages.ts.
      ;(function () {
        var theme
        try {
          theme = JSON.parse(localStorage.getItem('reglages-v1') || '{}').theme
        } catch (e) {}
        var sombre = theme === 'sombre' || (theme !== 'clair' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = sombre ? 'dark' : 'light'
      })()
    </script>
